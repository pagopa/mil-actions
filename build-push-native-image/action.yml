name: Build and push native container image
description: Build and push native container image.

inputs:
  gh_token:
    description: GitHub token.
    required: true
  sonar_token:
    description: SonarCloud token.
    required: true
  release_version:
    description: Version tag to use with container image
    required: true
  skip_test:
    description: True to skip Maven's test execution
    required: false
    default: "false"
  latest:
    description: True to also tag the container image as latest
    required: false
    default: "false"
  additional_tags:
    description: Additional comma-separated tags to apply to the container image
    required: false
    default: ""
outputs:
  image:
    description: "Built image"
    value: ${{ steps.get-image.outputs.image }}

runs:
  using: composite
  steps:
    #
    # Execute unit-test + Calculate test coverage + SCA with Sonar.
    #
    - name: Execute unit-test + Calculate test coverage + SCA with Sonar
      if: ${{ inputs.skip_test }} != 'true'
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      run: |
        ${{ runner.temp }}/maven/bin/mvn verify \
          -Pvalidate \
          -s ${{ runner.temp }}/settings.xml \
          --no-transfer-progress

    #
    # Build native executable.
    #
    - name: Build native executable
      shell: bash
      run: |
        ${{ runner.temp }}/maven/bin/mvn clean package \
          -Pnative \
          -Dmaven.test.skip=true \
          -Dquarkus.native.container-build=true \
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25.0.3@sha256:bf13d8b47e1022b17d3662c1a4914c099766830f6e7e5293b1611cdf60e22b1b \
          -s ${{ runner.temp }}/settings.xml \
          --no-transfer-progress

    #
    # Build container image.
    #
    - name: Build container image
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
        LATEST: ${{ inputs.latest }}
        ADDITIONAL_TAGS: ${{ inputs.additional_tags }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        TAGS="-t ghcr.io/$REPOSITORY:$RELEASE_VERSION"

        if [ "$LATEST" = "true" ]; then
          TAGS="$TAGS -t ghcr.io/$REPOSITORY:latest"
        fi

        if [ -n "$ADDITIONAL_TAGS" ]; then
          IFS=',' read -r -a EXTRA_TAGS <<< "$ADDITIONAL_TAGS"

          for raw_tag in "${EXTRA_TAGS[@]}"; do
            tag="${raw_tag#"${raw_tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"

            if [ -n "$tag" ]; then
              TAGS="$TAGS -t ghcr.io/$REPOSITORY:$tag"
            fi
          done
        fi

        docker build \
          -f src/main/docker/Dockerfile.native-micro \
          $TAGS \
          .

    #
    # Push container image.
    #
    - name: Push container image
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push -a ghcr.io/$REPOSITORY

    #
    # Get container image with sha256.
    #
    - name: Get container image with sha256
      id: get-image
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
        REPOSITORY: ${{ github.repository }}
      run: |
        temp=$(docker image inspect -f '{{index .RepoDigests 0}}' ghcr.io/$REPOSITORY:$RELEASE_VERSION)
        echo "image=${temp/@/:$RELEASE_VERSION@}" >> $GITHUB_OUTPUT
